<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EWC Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Oswald:wght@500;700&family=Montserrat:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3f6fa8;
      --blue-d: #2b4f7e;
      --title: #4a72a8;
      --orange: #ffa94d;
      --yellow: #ffc72c;
      --ink: #1d2f48;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Montserrat, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 60% 70% at 100% 100%, #2f5c98 0%, rgba(47,92,152,.85) 30%, rgba(47,92,152,0) 70%),
        radial-gradient(ellipse 50% 60% at 78% 22%, #ffffff 0%, rgba(255,255,255,.9) 40%, rgba(255,255,255,0) 100%),
        linear-gradient(100deg, #fbd9bb 0%, #fce4cd 22%, #f7f1ee 42%, #eef1f7 62%, #cfd9e8 85%, #aebfd8 100%);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* asterisk dekorasi */
    .ast {
      position: fixed;
      color: #4a72a8;
      opacity: .7;
      filter: blur(5px);
      pointer-events: none;
    }
    .ast svg { width: 100%; height: 100%; display: block; fill: currentColor; }
    .ast.a1 { width: 220px; height: 220px; left: -60px; top: -60px; }
    .ast.a2 { width: 180px; height: 180px; right: -50px; top: 30%; transform: rotate(20deg); }
    .ast.a3 { width: 150px; height: 150px; left: 10%; bottom: -50px; transform: rotate(-15deg); }
    .ast.a4 { width: 120px; height: 120px; right: 15%; bottom: 5%; transform: rotate(10deg); }

    .blob {
      position: fixed;
      border-radius: 50%;
      background: #ffb066;
      filter: blur(50px);
      opacity: .45;
      pointer-events: none;
    }
    .blob.b1 { width: 400px; height: 250px; left: 30%; top: -80px; }
    .blob.b2 { width: 300px; height: 380px; left: -100px; bottom: 50px; }

    /* ===== Konten ===== */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      padding: 40px 24px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* logo pill */
    .logos {
      width: 340px;
      height: 76px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(43,79,126,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
    }
    .logos img { object-fit: contain; width: auto; flex-shrink: 0; }
    .logos .logo-polinema  { height: 52px; }
    .logos .logo-emc1      { height: 44px; }
    .logos .logo-emc2      { height: 50px; }
    .logos .logo-workshop  { height: 42px; }
    .logos .logo-eeprom    { height: 48px; }

    /* judul */
    .head { text-align: center; color: var(--title); font-family: "Fjalla One", Oswald, sans-serif; }
    .head .edition { display: flex; align-items: flex-start; justify-content: center; gap: 2px; }
    .head .sup { font-size: 18px; font-weight: 400; margin-top: 6px; line-height: 1; }
    .head h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(32px, 5vw, 60px);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 4px 10px rgba(43,79,126,.3);
      white-space: nowrap;
    }
    .head h2 {
      margin: 6px 0 0;
      font-size: clamp(18px, 2.5vw, 30px);
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--blue-d);
    }

    /* kartu pilihan */
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
    }

    .card {
      flex: 1 1 220px;
      max-width: 240px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 24px;
      padding: 32px 20px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(43,79,126,.18);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(43,79,126,.28);
      border-color: var(--blue);
    }

    .card-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--blue);
    }
    .card-name {
      font-family: "Fjalla One", Oswald, sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--blue-d);
      letter-spacing: .5px;
      line-height: 1.2;
    }
    .card-desc {
      font-size: 12px;
      font-weight: 600;
      color: #6b7b93;
      line-height: 1.5;
    }

    .card-btn {
      margin-top: 4px;
      padding: 8px 24px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #5b93d6, var(--blue));
      color: #fff;
      font: 700 13px Montserrat, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43,79,126,.3);
      pointer-events: none; /* klik ditangani oleh <a> */
    }
    .card:hover .card-btn {
      background: linear-gradient(90deg, var(--orange), var(--yellow));
      color: #4a2c00;
    }
  </style>
</head>
<body>
  <!-- dekorasi -->
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="ast" viewBox="-100 -100 200 200">
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(0)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(45)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(90)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(135)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(180)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(225)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(270)"/>
      <rect x="-15" y="-96" width="30" height="90" rx="13" transform="rotate(315)"/>
    </symbol>
  </defs></svg>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="ast a1"><svg><use href="#ast"/></svg></div>
  <div class="ast a2"><svg><use href="#ast"/></svg></div>
  <div class="ast a3"><svg><use href="#ast"/></svg></div>
  <div class="ast a4"><svg><use href="#ast"/></svg></div>

  <div class="wrap">
    <!-- Logo -->
    <div class="logos">
      <img class="logo-polinema" src="assets/logo-polinema.png" alt="Polinema">
      <img class="logo-emc1" src="assets/logo-emc-1.png" alt="EMC">
      <img class="logo-emc2" src="assets/logo-emc-2.png" alt="EMC">
      <img class="logo-workshop" src="assets/logo-workshop.png" alt="Workshop">
      <img class="logo-eeprom" src="assets/logo-eeprom.png" alt="EEPROM">
    </div>

    <!-- Judul -->
    <div class="head">
      <div class="edition">
        <span class="sup">2<sup style="font-size:.6em">nd</sup></span>
        <h1>&nbsp;Electro Weeks Competition</h1>
      </div>
      <h2>Pilih Kategori Timer</h2>
    </div>

    <!-- Kartu pilihan -->
    <div class="cards">
      <a class="card" href="sumo.html">
        <div class="card-name">Sumo</div>
        <div class="card-desc">Robot bertarung di arena<br>menggunakan control PS4</div>
        <button class="card-btn">Buka Timer</button>
      </a>

      <a class="card" href="LF.html">
        <div class="card-name">Line Follower</div>
        <div class="card-desc">Robot mengikuti garis<br>secepat mungkin</div>
        <button class="card-btn">Buka Timer</button>
      </a>

      <a class="card" href="transporter.html">
        <div class="card-name">Transporter</div>
        <div class="card-desc">Robot memindahkan<br>objek ke tujuan</div>
        <button class="card-btn">Buka Timer</button>
      </a>
    </div>
  </div>
</body>
</html>
